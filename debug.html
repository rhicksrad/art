<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="One search across university museums, libraries and research archives, with charts and transparent API diagnostics."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Worker status · Art API Explorer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='2' fill='%23f4f1ea' stroke='%231c1a16' stroke-width='3'/%3E%3Cpath d='M9 7h14L9 21z' fill='%23a83a1b'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('art.theme'));
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
