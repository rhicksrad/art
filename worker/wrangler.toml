# Deploys to the existing Worker named "art" (https://art.hicksrch.workers.dev).
# Secrets (HARVARD_ARTMUSEUMS_KEY, UBC_OC_API_KEY, DATAVERSE_API_TOKEN) live in Cloudflare and
# are untouched by a deploy. keep_vars leaves dashboard-set variables in place too.
name = "art"
main = "worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
keep_vars = true

# The built site (pnpm build:cloudflare) is served by the same Worker, so pages and API share an
# origin. Static files are served without running the Worker; everything under /api does run it.
# /ubc-oai is both a page and a legacy API route, so the Worker decides which one was meant.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ubc-oai"]
