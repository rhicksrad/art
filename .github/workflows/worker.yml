name: worker

# Builds the site for Cloudflare and deploys it with the Worker "art" (static assets from
# dist/ plus the API). Runs on every push to main and by hand, on a GitHub-hosted runner so
# the Cloudflare token never reaches the self-hosted PCs, and is skipped when the repository
# has no CLOUDFLARE_API_TOKEN secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.creds.outputs.present == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.creds.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        if: steps.creds.outputs.present == 'true'
        run: pnpm deploy:cloudflare

      - name: Confirm the new version is live
        if: steps.creds.outputs.present == 'true'
        run: |
          want=$(grep -oP "const VERSION = '\K[^']+" worker/worker.js)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS https://art.hicksrch.workers.dev/api/diag | grep -oP '"version": "\K[^"]+' || true)
            if [ "$got" = "$want" ]; then echo "Live version: $got"; exit 0; fi
            sleep 10
          done
          echo "::error::Expected version $want but the Worker reports '$got'."
          exit 1
