name: worker

# Deploys worker/ to the Cloudflare Worker "art". It runs only when the Worker changes on
# main, or when started by hand, and only if the repository has a CLOUDFLARE_API_TOKEN secret.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        working-directory: worker
        run: npx --yes wrangler@4 deploy

      - name: Confirm the new version is live
        if: steps.creds.outputs.present == 'true'
        run: |
          want=$(grep -oP "const VERSION = '\K[^']+" worker/worker.js)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS https://art.hicksrch.workers.dev/diag | grep -oP '"version": "\K[^"]+' || true)
            if [ "$got" = "$want" ]; then echo "Live version: $got"; exit 0; fi
            sleep 10
          done
          echo "::error::Expected version $want but the Worker reports '$got'."
          exit 1
