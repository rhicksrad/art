name: pages

# The site now ships from the Cloudflare Worker (worker.yml). GitHub Pages only serves
# redirects to it (scripts/build-pages-redirect.mjs), so old links keep their path, query and
# hash. Built on the PCs when CI_RUNNER is 'local'; deployed from a GitHub-hosted job so the
# Pages OIDC token never touches them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build redirect pages
        run: node scripts/build-pages-redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-redirect
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf dist-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
