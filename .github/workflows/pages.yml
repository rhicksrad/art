name: pages

# Builds the site on push to main (self-hosted when CI_RUNNER is 'local') and deploys it
# from a GitHub-hosted job, so the Pages OIDC token never touches the PCs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","web-trusted"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        env:
          CI: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm build
      - run: pnpm smoke:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf node_modules dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
