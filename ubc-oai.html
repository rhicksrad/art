<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="One search across university museums, libraries and research archives, with charts and transparent API diagnostics."
    />
    <meta name="color-scheme" content="light dark" />
    <title>OAI-PMH harvester · Art API Explorer</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Art API Explorer" />
    <meta property="og:title" content="OAI-PMH harvester · Art API Explorer" />
    <meta
      property="og:description"
      content="One search across university museums, libraries and research archives, queried live through free public APIs."
    />
    <meta property="og:image" content="https://art.hicksrch.workers.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%231f3fbf'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('art.theme'));
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
